<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GymPulse Members — View, search, and manage all gym members.">
  <title>Members — GymPulse</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page">

    <!-- Navigation -->
    <nav class="nav" aria-label="Main navigation">
      <div class="container nav__inner">
        <a href="index.html" class="nav__brand" id="nav-brand">
          <div class="nav__logo" aria-hidden="true">G</div>
          <span class="nav__brand-name">GymPulse</span>
        </a>

        <button
          class="nav__toggle"
          id="nav-toggle"
          aria-label="Toggle navigation menu"
          aria-expanded="false"
          aria-controls="nav-links"
        >
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav__links" id="nav-links" role="menubar">
          <a href="index.html" class="nav__link" role="menuitem">Home</a>
          <a href="admin.html" class="nav__link" role="menuitem">Dashboard</a>
          <a href="members.html" class="nav__link" role="menuitem">Members</a>
          <a href="check-in.html" class="nav__link" role="menuitem">Check-in</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="page__content">
      <div class="container">

        <!-- Page Header -->
        <header class="page-header">
          <div class="page-header__row">
            <div>
              <h1 class="page-header__title">Members</h1>
              <p class="page-header__subtitle">View and manage all gym members.</p>
            </div>
            <a href="add-member.html" class="btn btn--primary" id="btn-add-member">
              + Add Member
            </a>
          </div>
        </header>

        <!-- Search & Filters -->
        <section class="card mb-6" aria-label="Search and filter members">
          <div class="flex items-center gap-4" style="flex-wrap: wrap;">
            <div style="flex: 1; min-width: 200px;">
              <input
                type="search"
                class="form-input"
                id="member-search"
                placeholder="Search by name or phone..."
                aria-label="Search members"
              >
            </div>
            <select class="form-select" id="member-filter-status" aria-label="Filter by status" style="width: auto; min-width: 150px;">
              <option value="all">All Members</option>
              <option value="active">Active</option>
              <option value="expiring">Expiring Soon</option>
              <option value="expired">Expired</option>
            </select>
          </div>
        </section>

        <!-- Result Count -->
        <div class="mb-4">
          <p class="text-sm text-secondary" id="member-count-text">Loading members...</p>
        </div>

        <!-- Members Table -->
        <section aria-label="Members list">
          <div class="empty-state card" id="members-empty" style="display: none;">
            <div class="empty-state__icon">🔍</div>
            <h2 class="empty-state__title">No members found</h2>
            <p class="empty-state__description">
              Try adjusting your search or filter.
            </p>
          </div>

          <!-- Table skeleton (hidden until data loads) -->
          <div class="table-wrapper" id="members-table-wrapper">
            <table class="table" id="members-table">
              <thead>
                <tr>
                  <th>Member</th>
                  <th>Phone</th>
                  <th>Plan</th>
                  <th>Joining Date</th>
                  <th>Expiry Date</th>
                  <th>Status</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="members-table-body">
                <!-- Rows will be dynamically inserted -->
              </tbody>
            </table>
          </div>
        </section>

      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="container footer__inner">
        <p class="footer__text">&copy; 2026 GymPulse. All rights reserved.</p>
        <p class="footer__text">Built for local gyms.</p>
      </div>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
